name: TidenUhr release check and index ZIP

on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'sw.js'
      - 'scripts/check-release.py'
      - '.github/workflows/release-check-and-zip.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tidenuhr-release-check
  cancel-in-progress: false

jobs:
  validate-and-package:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out main
        uses: actions/checkout@v4
      - name: Validate version, cache and archive pagination
        run: python3 scripts/check-release.py
      - name: Create ZIP containing index.html only
        id: package
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(python3 - <<'PY'
          import re
          from pathlib import Path
          html = Path("index.html").read_text(encoding="utf-8")
          match = re.search(r"""const\s+TIDENUHR_VERSION\s*=\s*["']([0-9]+(?:\.[0-9]+)+)["']""", html)
          if not match:
              raise SystemExit("TIDENUHR_VERSION fehlt")
          print(match.group(1))
          PY
          )"
          ZIP_NAME="TidenUhr-v${VERSION}-index-html.zip"
          python3 - "$ZIP_NAME" <<'PY'
          import sys
          import zipfile
          from pathlib import Path
          name = sys.argv[1]
          with zipfile.ZipFile(name, "w", compression=zipfile.ZIP_DEFLATED) as archive:
              archive.write("index.html", arcname="index.html")
          with zipfile.ZipFile(name) as archive:
              names = archive.namelist()
              if names != ["index.html"]:
                  raise SystemExit(f"Unerwarteter ZIP-Inhalt: {names}")
              if archive.read("index.html") != Path("index.html").read_bytes():
                  raise SystemExit("ZIP-Prüfung fehlgeschlagen: Dateiinhalt stimmt nicht.")
          PY
          echo "zip_name=${ZIP_NAME}" >> "$GITHUB_OUTPUT"
      - name: Upload downloadable ZIP artifact
        uses: actions/upload-artifact@v4
        with:
          name: TidenUhr-index-html-${{ github.sha }}
          path: ${{ steps.package.outputs.zip_name }}
          if-no-files-found: error
          retention-days: 90
      - name: Add release summary
        run: |
          echo "## TidenUhr Release-Prüfung" >> "$GITHUB_STEP_SUMMARY"
          echo "- Versionsabgleich: geprüft" >> "$GITHUB_STEP_SUMMARY"
          echo "- Service-Worker-Cache: geprüft" >> "$GITHUB_STEP_SUMMARY"
          echo "- Archiv-Paginierung: geprüft" >> "$GITHUB_STEP_SUMMARY"
          echo "- ZIP: enthält ausschließlich index.html" >> "$GITHUB_STEP_SUMMARY"
          echo "- Browser-/iPhone-Test: nicht Bestandteil dieses Workflows" >> "$GITHUB_STEP_SUMMARY"
