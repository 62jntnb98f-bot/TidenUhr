name: Restore main to stable commit
on:
  workflow_dispatch:
    inputs:
      target_sha:
        description: "Full 40-character commit SHA to restore"
        required: true
        type: string
      confirmation:
        description: 'Type RESTORE to confirm the production rollback'
        required: true
        type: string
permissions:
  contents: write
concurrency:
  group: production-main-rollback
  cancel-in-progress: false
jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - name: Check out complete repository history
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Validate target and create forward rollback commit
        env:
          TARGET_SHA: ${{ inputs.target_sha }}
          CONFIRMATION: ${{ inputs.confirmation }}
        run: |
          set -euo pipefail
          if [[ "${CONFIRMATION}" != "RESTORE" ]]; then
            echo "Confirmation text is incorrect. No changes made."
            exit 1
          fi
          if [[ ! "${TARGET_SHA}" =~ ^[0-9a-fA-F]{40}$ ]]; then
            echo "Target must be a full 40-character commit SHA. No changes made."
            exit 1
          fi

          git fetch origin main --tags
          CURRENT_SHA="$(git rev-parse origin/main)"
          git checkout -B main "${CURRENT_SHA}"
          git cat-file -e "${TARGET_SHA}^{commit}"
          if ! git merge-base --is-ancestor "${TARGET_SHA}" "${CURRENT_SHA}"; then
            echo "Target is not an ancestor of current main. Refusing rollback."
            exit 1
          fi
          if ! git cat-file -e "${TARGET_SHA}:index.html" || ! git cat-file -e "${TARGET_SHA}:sw.js"; then
            echo "Target is missing index.html or sw.js. Refusing rollback."
            exit 1
          fi

          BACKUP_TAG="rollback-before-${GITHUB_RUN_ID}-${CURRENT_SHA:0:12}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "${BACKUP_TAG}" "${CURRENT_SHA}" -m "Automatic pre-rollback safety point for ${CURRENT_SHA}"
          git push origin "refs/tags/${BACKUP_TAG}"

          # Restore the application tree exactly from the selected commit.
          git read-tree --reset -u "${TARGET_SHA}^{tree}"

          # Keep this recovery mechanism available even when restoring a commit
          # created before these workflow files existed.
          git restore --source="${CURRENT_SHA}" --staged --worktree -- \
            .github/workflows/rollback-backup.yml \
            .github/workflows/rollback-main.yml \
            ROLLBACK.md

          if git diff --cached --quiet; then
            echo "Target tree is already identical; no rollback commit is necessary."
            exit 0
          fi

          git commit -m "Rollback main to ${TARGET_SHA:0:12}"
          NEW_SHA="$(git rev-parse HEAD)"

          # Confirm the app entry point and service worker match the requested snapshot.
          git diff --exit-code "${TARGET_SHA}" "${NEW_SHA}" -- index.html sw.js
          git push origin HEAD:main

          echo "Rollback completed."
          echo "Previous main: ${CURRENT_SHA}"
          echo "Restored application snapshot: ${TARGET_SHA}"
          echo "New forward commit: ${NEW_SHA}"
          echo "Safety tag: ${BACKUP_TAG}"
