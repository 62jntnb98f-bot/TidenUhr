name: Create rollback point
on:
  push:
    branches:
      - main
permissions:
  contents: write
concurrency:
  group: rollback-point-${{ github.sha }}
  cancel-in-progress: false
jobs:
  tag:
    runs-on: ubuntu-latest
    steps:
      - name: Check out pushed commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Create immutable rollback tag
        env:
          GH_SHA: ${{ github.sha }}
          GH_RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          TAG="rollback-${GH_SHA}"
          if git show-ref --tags --verify --quiet "refs/tags/${TAG}"; then
            echo "Rollback tag already exists: ${TAG}"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "${TAG}" "${GH_SHA}" -m "Automatic rollback point for main commit ${GH_SHA} (run ${GH_RUN_ID})"
          git push origin "refs/tags/${TAG}"
