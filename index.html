/* v46.2 – manuelle Seitenaktualisierung mit Service-Worker-Cache-Bereinigung */
async function refreshTidenUhrPage(){
  const btn=document.getElementById('pageRefresh');
  if(btn){
    btn.disabled=true;
    btn.textContent='↻ Aktualisiere …';
  }
  try{
    if('serviceWorker' in navigator){
      const reg=await navigator.serviceWorker.getRegistration();
      if(reg){ try{ await reg.update(); }catch(e){} }
      if(window.caches){
        const keys=await caches.keys();
        await Promise.all(keys.map(k=>caches.delete(k)));
      }
    }
  }catch(e){}
  const u=new URL(window.location.href);
  u.searchParams.set('_refresh',Date.now().toString());
  window.location.replace(u.toString());
}
